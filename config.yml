custom-models:
  # Custom looks for weapons and artifacts. Turn off to use plain vanilla items.
  enabled: true

resource-pack:
  # builtin  = this plugin hosts the pack inside the server (set host + port)
  # external = you host the zip yourself (set url + sha1)
  # off      = do not send any pack
  mode: builtin
  host: ""      # your server's public IP or domain, e.g. play.example.com
  port: 8164    # TCP port that must be open to players (builtin only)
  url: ""       # direct link to the Java pack zip (external only)
  sha1: ""      # sha1 of that zip (external only)
  force: false  # kick players who decline the pack

geyser:
  # Copies the Bedrock pack and mappings into plugins/Geyser-Spigot if it exists.
  auto-install: true

unlock:
  # Crafted weapons start locked. Unique player kills unlock them in stages:
  # 1 kill = passive, 2 kills = ability 1, 3 kills = ability 2
  enabled: true

power:
  hits-per-bar: 5       # melee hits needed to fill one power bar (3 bars max)
                        # a mace smash (falling hit) fills a whole bar

weapons:
  shockwave:
    cooldown1: 12
    cooldown2: 25
    stun-seconds: 1
    chain-damage: 5
  lifestealer:
    cooldown1: 20
    cooldown2: 35
    heal-percent: 0.3
    venom-chance: 0.15
  warden_battleaxe:
    cooldown1: 15
    cooldown2: 25
    sonic-damage: 7
    spread-sculk: true
  primal_spear:
    cooldown1: 10
    cooldown2: 25
    throw-damage: 7
    vines-seconds: 3
    speed-amplifier: 1
  afterburner:
    cooldown1: 8
    cooldown2: 20
    orb-damage: 5
    shuriken-damage: 6
  void_hammer:
    cooldown1: 12
    cooldown2: 30
    toss-range: 20
    peekaboo-range: 40
    peekaboo-height: 8
    levitation-chance: 0.15

artifacts:
  cloak_of_shadows:
    cooldown: 90
    seconds: 15
  jumbo_rocket:
    cooldown: 60
  gale_rod:
    cooldown: 20
  chrono_clock:
    cooldown: 120
  tracker_compass:
    cooldown: 30
    range: 150
  bucket_of_malk:
    cooldown: 60
  bucket_of_greed:
    cooldown: 60
    radius: 12

recipes:
  enabled: true

structures:
  enabled: true
  # Chance per newly generated chunk to spawn a shrine (0.004 = 0.4%)
  chance: 0.004
  # Chance that a shrine's loot chest holds a random artifact
  artifact-chance: 0.35
  # Leave empty for every overworld, or list world names e.g. [world]
  worlds: []
